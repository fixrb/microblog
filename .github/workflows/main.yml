name: Fix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec fix
